name: Ranking semanal
# Lee los envíos de la cola (ntfy), verifica la firma de Telegram y publica la tabla en la rama ranking-data.
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ranking
  cancel-in-progress: false
jobs:
  procesar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            tools/ranking
      - uses: actions/checkout@v4
        with:
          ref: ranking-data
          path: datos
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Procesar envíos
        env:
          TG_WEBAPP_SECRET: ${{ secrets.TG_WEBAPP_SECRET }}
          RANKING_PRIVATE_KEY: ${{ secrets.RANKING_PRIVATE_KEY }}
          NTFY_TOPIC: ${{ vars.NTFY_TOPIC }}
        run: node tools/ranking/procesar.js datos
      - name: Guardar cambios
        working-directory: datos
        run: |
          git add -A
          if git diff --cached --quiet; then echo "Sin cambios"; exit 0; fi
          git -c user.name=espigamarket33 -c user.email=espigamarket33@users.noreply.github.com commit -q -m "ranking: actualizar $(date -u +%FT%TZ)"
          git push -q origin HEAD:ranking-data
